  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #000;
    }

    #scene-container {
      position: fixed;
      inset: 0;
      z-index: 1;
    }

    .vignette-overlay {
      position: fixed;
      inset: 0;
      z-index: 5;
      pointer-events: none;
      background: radial-gradient(
        circle at center,
        rgba(0, 0, 0, 0) 50%,
        rgba(0, 0, 0, 0.65) 100%
      );
    }

    #panorama-buttons {
      position: fixed;
      top: 1rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      padding: 0.4rem 0.6rem;
      background: rgba(0, 0, 0, 0.6);
      border-radius: 999px;
      backdrop-filter: blur(8px);
    }

    .pano-btn {
      border: none;
      border-radius: 999px;
      padding: 0.25rem 0.55rem;
      font-size: 0.75rem;
      cursor: pointer;
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      transition: background 0.15s ease, transform 0.15s ease, color 0.15s ease;
      outline: none;
    }

    .pano-btn:hover {
      background: rgba(255, 255, 255, 0.3);
      transform: translateY(-1px);
    }

    .pano-btn:active {
      transform: translateY(0);
    }

    .pano-btn.active {
      background: rgba(255, 255, 255, 0.95);
      color: #111827;
      transform: translateY(-1px);
    }

    #logo-box {
      position: fixed;
      top: 1rem;
      left: 1rem;
      z-index: 50;
      padding: 0.35rem 0.8rem;
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(8px);
      border-radius: 12px;
      display: flex;
      align-items: center;
    }

    .logo-img {
      height: 38px;
      width: auto;
      display: block;
    }


    /* Скрытый элемент */
.taras-hidden {
  display: none;
}

/* Большая кнопка Taras AI */
.taras-ai-button {
  position: fixed;
  right: 24px;
  bottom: 24px;
  z-index: 9999;

  padding: 14px 22px;
  border-radius: 999px;
  border: none;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;

  background: linear-gradient(135deg, #0052ff, #ffcc00);
  color: #fff;
  box-shadow: 0 12px 26px rgba(0, 0, 0, 0.25);

  display: flex;
  align-items: center;
  gap: 8px;

  transition: transform 0.15s ease, box-shadow 0.15s ease;
}

.taras-ai-button:hover {
  transform: translateY(-3px);
  box-shadow: 0 16px 32px rgba(0, 0, 0, 0.3);
}

/* Панель с ассистентом */
.taras-ai-panel {
  position: fixed;
  right: 24px;
  bottom: 90px;
  width: 420px;
  height: 620px;
  max-height: calc(100vh - 120px);
  z-index: 9998;

  background: #ffffff;
  border-radius: 18px;
  box-shadow: 0 18px 45px rgba(0, 0, 0, 0.35);

  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* Шапка панели */
.taras-ai-header {
  background: #0b2e5b;
  color: #fff;
  font-weight: 600;
  padding: 10px 14px;

  display: flex;
  justify-content: space-between;
  align-items: center;
}

.taras-ai-close {
  background: transparent;
  border: none;
  font-size: 16px;
  color: inherit;
  cursor: pointer;
}

/* Тело панели */
.taras-ai-body {
  flex: 1;
  overflow: hidden;
  position: relative;
}

/* Мобильная адаптация */
@media (max-width: 650px) {
  .taras-ai-panel {
    right: 8px;
    left: 8px;
    bottom: 80px;
    width: auto;
    height: 70vh;
  }

  .taras-ai-button {
    right: 8px;
    left: 8px;
    justify-content: center;
  }




    
  </style>
</head>

<body>
  <!-- 🔵 БОЛЬШАЯ КНОПКА TARAS AI -->
  <button id="taras-ai-button" class="taras-ai-button">
    🤖 Taras AI — Ask me
  </button>

  <!-- 🔵 ПАНЕЛЬ С ВИДЖЕТОМ (по умолчанию скрыта) -->
  <div id="taras-ai-panel" class="taras-ai-panel taras-hidden">
    <div class="taras-ai-header">
      <span>Taras: The Holodomor Bard</span>
      <button id="taras-ai-close" class="taras-ai-close">✕</button>
    </div>

    <div class="taras-ai-body">
      <!-- Тут живёт твой Pickaxe / Ishare ассистент -->
      <div id="deployment-a9d6bc90-e664-453e-95e8-326fe5161ca6"></div>
    </div>
  </div>

  <!-- 360° сцена -->
  <div id="scene-container"></div>

  <!-- Логотип -->
  <div id="logo-box">
    <img src="img/lg.png" alt="HREC logo" class="logo-img" />
  </div>

  <!-- Виньетка -->
  <div class="vignette-overlay"></div>

  <!-- Кнопки панорам -->
  <div id="panorama-buttons">
    <button class="pano-btn" data-img="1">1</button>
    <button class="pano-btn" data-img="2">2</button>
    <button class="pano-btn" data-img="3">3</button>
    <button class="pano-btn" data-img="4">4</button>
    <button class="pano-btn" data-img="5">5</button>
    <button class="pano-btn" data-img="6">6</button>
    <button class="pano-btn" data-img="7">7</button>
    <button class="pano-btn" data-img="8">8</button>
    <button class="pano-btn" data-img="9">9</button>
    <button class="pano-btn" data-img="10">10</button>
    <button class="pano-btn" data-img="11">11</button>
    <button class="pano-btn" data-img="12">12</button>
    <button class="pano-btn" data-img="13">13</button>
  </div>

  <!-- Скрипт Pickaxe (обязательно, но теперь он один) -->
  <script src="https://studio.pickaxe.co/api/embed/bundle.js" defer></script>

  <!-- Твой Three.js код -->
  <script type="module">
    import * as THREE from './js/three.module.js';
    import { OrbitControls } from './js/OrbitControls.js';

    let scene, camera, renderer, controls;
    let geometry, sphere, material, textureLoader;
    let fadeSphere = null;
    let fadeMaterial = null;
    let isFading = false;
    let fadeProgress = 0;
    const fadeSpeed = 0.02;

    const container = document.getElementById('scene-container');

    function init() {
      scene = new THREE.Scene();

      camera = new THREE.PerspectiveCamera(
        75,
        window.innerWidth / window.innerHeight,
        0.1,
        1000
      );
      camera.position.set(0, 0, 0.1);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      container.appendChild(renderer.domElement);

      geometry = new THREE.SphereGeometry(500, 60, 40);
      geometry.scale(-1, 1, 1);

      textureLoader = new THREE.TextureLoader();
      const startTexture = textureLoader.load('img/3.jpg', (tex) => {
        tex.colorSpace = THREE.SRGBColorSpace;
        render();
      });

      material = new THREE.MeshBasicMaterial({
        map: startTexture,
        transparent: true,
        opacity: 1
      });

      sphere = new THREE.Mesh(geometry, material);
      scene.add(sphere);

      controls = new OrbitControls(camera, renderer.domElement);
      controls.enableZoom = false;
      controls.enableDamping = true;
      controls.dampingFactor = 0.08;
      controls.rotateSpeed = 0.4;
      controls.autoRotate = true;
      controls.autoRotateSpeed = 0.3;
      controls.minPolarAngle = 0.1;
      controls.maxPolarAngle = Math.PI - 0.1;

      window.addEventListener('resize', onWindowResize);

      animate();
    }

    function changePanorama(num) {
      if (isFading) return;

      const newTexture = textureLoader.load(`img/${num}.jpg`, (tex) => {
        tex.colorSpace = THREE.SRGBColorSpace;
      });

      fadeMaterial = new THREE.MeshBasicMaterial({
        map: newTexture,
        transparent: true,
        opacity: 0
      });

      fadeSphere = new THREE.Mesh(geometry, fadeMaterial);
      scene.add(fadeSphere);

      material.transparent = true;
      material.opacity = 1;

      isFading = true;
      fadeProgress = 0;
    }

    const panoButtons = document.querySelectorAll('.pano-btn');

    const initialBtn = document.querySelector('.pano-btn[data-img="3"]');
    if (initialBtn) {
      initialBtn.classList.add('active');
    }

    panoButtons.forEach((btn) => {
      btn.addEventListener('click', () => {
        const num = btn.getAttribute('data-img');

        changePanorama(num);

        panoButtons.forEach((b) => b.classList.remove('active'));
        btn.classList.add('active');
      });
    });

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      render();
    }

    function animate() {
      requestAnimationFrame(animate);

      controls.update();

      if (isFading && fadeSphere && fadeMaterial) {
        fadeProgress += fadeSpeed;

        if (fadeProgress >= 1) {
          fadeProgress = 1;
          isFading = false;

          material.map = fadeMaterial.map;
          material.opacity = 1;
          material.transparent = true;
          material.needsUpdate = true;

          scene.remove(fadeSphere);
          fadeSphere.geometry.dispose();
          fadeMaterial.dispose();

          fadeSphere = null;
          fadeMaterial = null;
        } else {
          material.opacity = 1 - fadeProgress;
          fadeMaterial.opacity = fadeProgress;
        }
      }

      render();
    }

    function render() {
      renderer.render(scene, camera);
    }

    init();
  </script>

  <!-- JS для открытия/закрытия панели Taras AI -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const btn = document.getElementById("taras-ai-button");
      const panel = document.getElementById("taras-ai-panel");
      const close = document.getElementById("taras-ai-close");

      if (!btn || !panel || !close) return;

      btn.addEventListener("click", () => {
        panel.classList.toggle("taras-hidden");
      });

      close.addEventListener("click", () => {
        panel.classList.add("taras-hidden");
      });
    });
  </script>
</body>

</html>
